name: Build APK
on: [push, workflow_dispatch]

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Force Git and Download Flutter SDK
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /home/runner/flutter
          echo "/home/runner/flutter/bin" >> $GITHUB_PATH

      - name: Setup Gradle AliYun Mirrors
        run: |
          mkdir -p ~/.gradle
          echo "allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }" > ~/.gradle/init.gradle

      - name: Pre-install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"

      - name: Install Flet
        run: pip install flet==0.24.1 pypinyin

      - name: Build APK
        run: flet build apk
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/apk/*.apk
